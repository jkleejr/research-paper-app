name: PaperReader
options:
  bundleIdPrefix: com.jklwjr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PaperReader:
    type: application
    platform: iOS
    sources:
      # xcconfig files here are local developer scratch, not app inputs —
      # keep them out of the target so a key can never ride along in a build.
      - path: PaperReader
        excludes:
          - "Support/*.xcconfig"
          - "Resources/SampleLibrary"
      # Folder reference, so sample.json and audio/ keep their structure in the
      # bundle instead of being flattened into the resource root.
      - path: PaperReader/Resources/SampleLibrary
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jklwjr.PaperReader
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 42WF5JQ74Y
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Paper Reader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: PaperReader/Support/Info.plist
      properties:
        CFBundleDisplayName: Paper Reader
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        # HTTPS-only networking -> exempt from export compliance docs; skips
        # the manual compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio

  # Drives the app to capture App Store screenshots at full device resolution.
  # Test target only — never part of the shipped app.
  PaperReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PaperReaderUITests
    dependencies:
      - target: PaperReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jklwjr.PaperReaderUITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 42WF5JQ74Y
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  PaperReader:
    build:
      targets:
        PaperReader: all
        PaperReaderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaperReaderUITests
    archive:
      config: Release
